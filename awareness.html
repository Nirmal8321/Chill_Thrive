<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chill Thrive | Awareness</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

<nav class="navbar animate-fade-up">
  <a href="index.html">Home</a>
  <a href="services.html">Services</a>
  <a href="booking.html">Book Now</a>
  <a href="awareness.html">Awareness</a>
  <a href="founder.html">Founder</a>
  <a href="gallery.html">Gallery</a>
  <a href="contact.html">Contact</a>
</nav>

<header class="page-header animate-fade-up">
  <h1>Recovery Awareness</h1>
  <p>Understanding cold and heat therapy for better health.</p>
</header>

<section class="content-section" id="awarenessContainer">
  <p style="text-align:center; width:100%; color:#666;">Loading knowledge base...</p>
</section>

<footer class="site-footer">
  <p>© 2026 Chill Thrive | Wellness & Recovery</p>
</footer>

<script type="module">
  import { db, collection, getDocs } from "./js/firebase.js";

  const container = document.getElementById("awarenessContainer");

  async function loadAwareness() {
    try {
      const snapshot = await getDocs(collection(db, "awareness_cards"));
      
      if (snapshot.empty) {
        container.innerHTML = `<p style="text-align:center; width:100%;">No content found. Please go to Admin Panel > Awareness > Click 'Load Default Boxes'.</p>`;
        return;
      }

      container.innerHTML = ""; // Clear loader

      snapshot.forEach(doc => {
        const data = doc.data();
        
        // Handle "Warning" style vs "Normal" style
        const isWarning = data.type === 'warning';
        const cardClass = isWarning ? 'content-card warning animate-fade-up' : 'content-card animate-fade-up';
        const borderStyle = isWarning ? 'border-left: 5px solid #ff4d4d;' : '';
        const iconColor = isWarning ? '#ff4d4d' : '#0077cc';
        
        const card = document.createElement("div");
        card.className = cardClass;
        if(isWarning) card.style.borderLeft = "5px solid #ff4d4d";

        card.innerHTML = `
          <i class="fas ${data.icon}" style="font-size: 2rem; color: ${iconColor}; margin-bottom: 10px;"></i>
          <h2>${data.title}</h2>
          <p>${data.description}</p>
        `;
        
        container.appendChild(card);
      });

      // Animation
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => { if(entry.isIntersecting) entry.target.style.animationPlayState = 'running'; });
      });
      document.querySelectorAll('.animate-fade-up').forEach(el => observer.observe(el));

    } catch (err) {
      console.error(err);
      container.innerHTML = "Error loading content.";
    }
  }
  loadAwareness();
</script>

</body>
</html>
