<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chill Thrive | Book Session</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <style>
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    .error-msg { color: red; font-size: 0.9rem; margin-top: 5px; display: none; }
  </style>
</head>

<body>

<nav class="navbar animate-fade-up">
  <a href="index.html">Home</a>
  <a href="services.html">Services</a>
  <a href="booking.html">Book Now</a>
  <a href="awareness.html">Awareness</a>
  <a href="founder.html">Founder</a>
  <a href="gallery.html">Gallery</a>
  <a href="contact.html">Contact</a>
</nav>

<header class="page-header animate-fade-up">
  <h1>Book Your Recovery</h1>
  <p>Select your session and time below.</p>
</header>

<section class="booking-section animate-fade-up" style="max-width: 600px; margin: 0 auto 50px; padding: 20px;">
  <form class="card" id="bookingForm" style="box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
    
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="John Doe" required>
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="john@example.com" required>
    </div>

    <div class="form-group">
      <label>Service</label>
      <select id="service" required>
        <option value="" disabled selected>Select a Service</option>
        <option value="Ice Bath">Ice Bath Therapy</option>
        <option value="Jacuzzi">Jacuzzi Therapy</option>
        <option value="Steam">Steam Bath</option>
        <option value="Combo">Full Recovery Combo</option>
      </select>
    </div>

    <div class="form-group">
      <label>Date</label>
      <input type="date" id="date" required>
    </div>

    <div class="form-group">
      <label>Time Slot</label>
      <select id="time" required>
        <option value="" disabled selected>Select Time</option>
        <option value="08:00 AM">08:00 AM</option>
        <option value="09:00 AM">09:00 AM</option>
        <option value="10:00 AM">10:00 AM</option>
        <option value="11:00 AM">11:00 AM</option>
        <option value="04:00 PM">04:00 PM</option>
        <option value="05:00 PM">05:00 PM</option>
        <option value="06:00 PM">06:00 PM</option>
        <option value="07:00 PM">07:00 PM</option>
      </select>
      <p class="error-msg" id="slotError">⚠️ This slot is already booked! Please choose another.</p>
    </div>

    <button type="submit" class="btn" style="width: 100%;" id="submitBtn">Confirm Booking</button>
  </form>
</section>

<footer class="site-footer">
  <p>© 2026 Chill Thrive | Wellness & Recovery</p>
</footer>

<script type="module">
  // 1. Import 'query' and 'where' to search the database
  import { db, collection, addDoc, getDocs, query, where } from "./js/firebase.js";

  const form = document.getElementById("bookingForm");
  const submitBtn = document.getElementById("submitBtn");
  const slotError = document.getElementById("slotError");

  // Prevent selecting past dates
  const today = new Date().toISOString().split('T')[0];
  document.getElementById("date").setAttribute('min', today);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    
    // Disable button to prevent double-clicks
    submitBtn.innerText = "Checking Availability...";
    submitBtn.disabled = true;
    slotError.style.display = "none";

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const service = document.getElementById("service").value;
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;

    try {
      // --- STEP 1: THE GATEKEEPER ---
      // Ask DB: Are there any bookings with this Date AND this Time?
      const q = query(
        collection(db, "bookings"), 
        where("date", "==", date), 
        where("time", "==", time)
      );

      const snapshot = await getDocs(q);

      if (!snapshot.empty) {
        // FOUND A DUPLICATE! Stop everything.
        slotError.style.display = "block";
        submitBtn.innerText = "Slot Unavailable";
        submitBtn.style.background = "#ff4d4f";
        
        // Reset button after 3 seconds
        setTimeout(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Confirm Booking";
            submitBtn.style.background = "#0077cc";
        }, 3000);
        return; 
      }

      // --- STEP 2: IF EMPTY, SAVE IT ---
      await addDoc(collection(db, "bookings"), {
        name, email, service, date, time,
        timestamp: new Date()
      });

      alert("Booking Confirmed! See you soon.");
      form.reset();
      submitBtn.innerText = "Confirm Booking";
      submitBtn.disabled = false;

    } catch (error) {
      console.error("Error:", error);
      alert("Something went wrong. Check console.");
      submitBtn.disabled = false;
    }
  });

  // Animations
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => { if(entry.isIntersecting) entry.target.style.animationPlayState = 'running'; });
  });
  document.querySelectorAll('.animate-fade-up').forEach(el => observer.observe(el));
</script>

</body>
</html>
