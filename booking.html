<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chill Thrive | Book a Session</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">
  <a href="index.html">Home</a>
  <a href="services.html">Services</a>
  <a href="booking.html">Book Now</a>
  <a href="awareness.html">Awareness</a>
  <a href="founder.html">Founder</a>
  <a href="gallery.html">Gallery</a>
  <a href="contact.html">Contact</a>
</nav>

<header class="page-header">
  <h1>Book Your Recovery Session</h1>
  <p>Fill the form below to reserve your session.</p>
</header>

<section class="booking-section">
  <form class="booking-form" id="bookingForm">

    <label>Full Name</label>
    <input type="text" id="name" required>

    <label>Email</label>
    <input type="email" id="email" required>

    <label>Service</label>
    <select id="service" required>
      <option value="">Select Service</option>
      <option>Ice Bath Therapy</option>
      <option>Steam Bath</option>
      <option>Jacuzzi Therapy</option>
      <option>Full Recovery Combo</option>
    </select>

    <label>Date</label>
    <input type="date" id="date" required>

    <label>Time</label>
    <input type="time" id="time" required>

    <button class="btn" type="submit">Confirm Booking</button>
    <p class="success-message" id="successMessage"></p>

  </form>
</section>

<footer class="site-footer">
  <p>© 2026 Chill Thrive</p>
</footer>

<!-- Firebase Script -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDT2G4Fd0HhSBo7Ie1m0sF8c7-CNLOV7Ho",
    authDomain: "giggle-gird-gwoc-2026.firebaseapp.com",
    projectId: "giggle-gird-gwoc-2026",
    storageBucket: "giggle-gird-gwoc-2026.appspot.com",
    messagingSenderId: "18442374008",
    appId: "1:18442374008:web:89f62a6721c94377c6968d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const form = document.getElementById("bookingForm");
  const msg = document.getElementById("successMessage");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    try {
      await addDoc(collection(db, "bookings"), {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        service: document.getElementById("service").value,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value,
        createdAt: new Date()
      });

      msg.innerText = "Booking saved successfully!";
      form.reset();
    } catch (err) {
      console.error(err);
      msg.innerText = "Error saving booking";
    }
  });
</script>

</body>
</html>
